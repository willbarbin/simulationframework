<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Launch Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-void:#0A1120;
    --bg-panel:#101A2C;
    --bg-panel-alt:#0C1524;
    --line:#223349;
    --amber:#FFB300;
    --amber-dim:#7A5A16;
    --cyan:#57E0E8;
    --cyan-dim:#2C6E73;
    --red:#FF5C5C;
    --green:#58E6A0;
    --text:#E9EEF7;
    --text-dim:#8195B4;
    --font-display:'Space Grotesk',sans-serif;
    --font-mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg-void);
    color:var(--text);
    font-family:var(--font-display);
    overflow:hidden;
  }
  button{font-family:var(--font-display);}
  input{font-family:var(--font-mono);}
  ::selection{background:var(--amber);color:#1a1204;}
  :focus-visible{outline:2px solid var(--cyan);outline-offset:2px;}

  .app{
    display:grid;
    grid-template-rows:auto 1fr auto;
    height:100vh;
  }

  /* ---------- header ---------- */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 20px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,var(--bg-panel),var(--bg-void));
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .brand .mark{
    width:10px;height:10px;border-radius:50%;
    background:var(--green);
    box-shadow:0 0 8px var(--green);
    display:inline-block;
  }
  .brand h1{
    font-size:17px;
    margin:0;
    letter-spacing:0.02em;
    font-weight:600;
  }
  .brand .sub{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--text-dim);
  }
  .planet-tabs{
    display:flex;
    gap:4px;
    background:var(--bg-panel-alt);
    border:1px solid var(--line);
    border-radius:6px;
    padding:3px;
  }
  .planet-tabs button{
    background:transparent;
    border:none;
    color:var(--text-dim);
    font-size:12.5px;
    font-weight:600;
    padding:6px 12px;
    border-radius:4px;
    cursor:pointer;
    letter-spacing:0.03em;
  }
  .planet-tabs button.active{
    background:var(--amber);
    color:#1a1204;
  }
  .planet-tabs button:not(.active):hover{
    color:var(--text);
  }

  /* ---------- main split ---------- */
  .main{
    display:grid;
    grid-template-columns:340px 1fr;
    min-height:0;
  }
  @media (max-width:860px){
    .main{grid-template-columns:1fr;grid-template-rows:auto 1fr;}
    .panel{max-height:46vh;}
  }

  .panel{
    background:var(--bg-panel);
    border-right:1px solid var(--line);
    overflow-y:auto;
    padding:18px 18px 28px;
  }
  .panel::-webkit-scrollbar{width:8px;}
  .panel::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}

  .section-title{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--cyan);
    letter-spacing:0.08em;
    margin:22px 0 10px;
    text-transform:uppercase;
  }
  .section-title:first-child{margin-top:0;}

  .field{margin-bottom:14px;}
  .field-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:4px;
  }
  .field-row label{font-size:12.5px;color:var(--text-dim);}
  .field-row .val{
    font-family:var(--font-mono);
    font-size:12.5px;
    color:var(--text);
  }
  input[type=range]{
    -webkit-appearance:none;
    width:100%;
    height:4px;
    border-radius:2px;
    background:var(--line);
    outline-offset:4px;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:14px;height:14px;
    border-radius:50%;
    background:var(--amber);
    cursor:pointer;
    border:2px solid #1a1204;
    margin-top:-5px;
  }
  input[type=range]::-moz-range-thumb{
    width:14px;height:14px;border-radius:50%;
    background:var(--amber);cursor:pointer;border:2px solid #1a1204;
  }
  input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;}

  .propellant-note{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--text-dim);
    margin-top:2px;
  }

  .weather-card{
    background:var(--bg-panel-alt);
    border:1px solid var(--line);
    border-radius:8px;
    padding:14px;
  }
  .weather-card .day{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--text-dim);
    margin-bottom:6px;
  }
  .weather-card .wind-line{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
  }
  .wind-arrow{
    font-size:20px;
    display:inline-block;
    color:var(--cyan);
    transition:transform 0.4s ease;
  }
  .weather-card .wind-speed{
    font-family:var(--font-mono);
    font-size:20px;
    font-weight:600;
  }
  .weather-card .wind-desc{
    font-size:12px;
    color:var(--text-dim);
  }
  .weather-actions{display:flex;gap:8px;}
  .btn{
    font-weight:600;
    font-size:13px;
    border-radius:6px;
    padding:10px 14px;
    cursor:pointer;
    border:1px solid var(--line);
    background:var(--bg-panel);
    color:var(--text);
    flex:1;
    transition:filter 0.15s ease, transform 0.1s ease;
  }
  .btn:hover{filter:brightness(1.15);}
  .btn:active{transform:scale(0.98);}
  .btn-primary{
    background:var(--amber);
    color:#1a1204;
    border-color:var(--amber);
  }
  .btn-primary:disabled{
    background:var(--amber-dim);
    border-color:var(--amber-dim);
    color:#8a6d2f;
    cursor:not-allowed;
  }
  .btn-ghost{background:transparent;}

  select{
    width:100%;
    background:var(--bg-panel-alt);
    border:1px solid var(--line);
    color:var(--text);
    padding:9px 10px;
    border-radius:6px;
    font-size:13px;
  }

  /* ---------- viewport ---------- */
  .viewport-wrap{
    position:relative;
    min-height:0;
    overflow:hidden;
    background:#05070D;
  }
  canvas{display:block;width:100%;height:100%;}

  .status-badge{
    position:absolute;
    top:14px;left:14px;
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:0.08em;
    padding:6px 10px;
    border-radius:5px;
    background:rgba(10,17,32,0.7);
    border:1px solid var(--line);
    color:var(--text-dim);
  }
  .status-badge.live{color:var(--green);border-color:var(--green);}
  .status-badge.crash{color:var(--red);border-color:var(--red);}
  .status-badge.land{color:var(--cyan);border-color:var(--cyan);}

  .speed-controls{
    position:absolute;
    top:14px;right:14px;
    display:flex;
    gap:4px;
    background:rgba(10,17,32,0.7);
    border:1px solid var(--line);
    border-radius:6px;
    padding:3px;
  }
  .speed-controls button{
    background:transparent;
    border:none;
    color:var(--text-dim);
    font-family:var(--font-mono);
    font-size:11px;
    padding:5px 9px;
    border-radius:4px;
    cursor:pointer;
  }
  .speed-controls button.active{background:var(--cyan);color:#04262a;}

  .result-overlay{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(5,7,13,0.72);
    backdrop-filter:blur(2px);
    opacity:0;
    pointer-events:none;
    transition:opacity 0.3s ease;
  }
  .result-overlay.show{opacity:1;pointer-events:auto;}
  .result-card{
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:26px 30px;
    width:min(360px,86%);
    text-align:center;
  }
  .result-card h2{
    margin:0 0 4px;
    font-size:22px;
  }
  .result-card h2.crash{color:var(--red);}
  .result-card h2.land{color:var(--cyan);}
  .result-card p{
    color:var(--text-dim);
    font-size:13px;
    margin:0 0 18px;
  }
  .result-stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:20px;
    text-align:left;
  }
  .result-stats div{
    background:var(--bg-panel-alt);
    border:1px solid var(--line);
    border-radius:6px;
    padding:8px 10px;
  }
  .result-stats .lbl{font-family:var(--font-mono);font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.06em;}
  .result-stats .num{font-family:var(--font-mono);font-size:15px;margin-top:2px;}
  .result-actions{display:flex;gap:8px;}

  .countdown{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:var(--font-mono);
    font-size:90px;
    font-weight:600;
    color:var(--amber);
    text-shadow:0 0 30px rgba(255,179,0,0.5);
    opacity:0;
    pointer-events:none;
  }
  .countdown.show{opacity:1;}

  /* ---------- telemetry strip ---------- */
  .telemetry{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    border-top:1px solid var(--line);
    background:var(--bg-panel);
  }
  @media (max-width:860px){
    .telemetry{grid-template-columns:repeat(3,1fr);}
  }
  .tcell{
    padding:9px 14px;
    border-right:1px solid var(--line);
  }
  .tcell:last-child{border-right:none;}
  .tcell .lbl{
    font-family:var(--font-mono);
    font-size:10px;
    color:var(--text-dim);
    letter-spacing:0.07em;
    text-transform:uppercase;
  }
  .tcell .num{
    font-family:var(--font-mono);
    font-size:16px;
    font-variant-numeric:tabular-nums;
    margin-top:2px;
  }
  .tcell .num.amber{color:var(--amber);}
  .tcell .num.cyan{color:var(--cyan);}

  @media (prefers-reduced-motion:reduce){
    .wind-arrow,.result-overlay,.countdown,.btn{transition:none;}
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="brand">
      <span class="mark" id="statusDot"></span>
      <h1>Launch Console</h1>
      <span class="sub">2D powered-flight simulator</span>
    </div>
    <div class="planet-tabs" id="planetTabs">
      <button data-planet="earth" class="active">EARTH</button>
      <button data-planet="mars">MARS</button>
      <button data-planet="venus">VENUS</button>
      <button data-planet="moon">MOON</button>
    </div>
  </header>

  <div class="main">
    <div class="panel" id="panel">

      <div class="section-title">Vehicle</div>

      <div class="field">
        <div class="field-row"><label for="thrust">Thrust</label><span class="val" id="thrustVal"></span></div>
        <input type="range" id="thrust" min="50000" max="2000000" step="10000" value="600000">
      </div>
      <div class="field">
        <div class="field-row"><label for="burnTime">Burn time</label><span class="val" id="burnTimeVal"></span></div>
        <input type="range" id="burnTime" min="2" max="60" step="1" value="15">
      </div>
      <div class="field">
        <div class="field-row"><label for="area">Cross-section area</label><span class="val" id="areaVal"></span></div>
        <input type="range" id="area" min="0.3" max="6" step="0.1" value="1.5">
      </div>
      <div class="field">
        <div class="field-row"><label for="massInitial">Initial mass</label><span class="val" id="massInitialVal"></span></div>
        <input type="range" id="massInitial" min="5000" max="100000" step="500" value="40000">
      </div>
      <div class="field">
        <div class="field-row"><label for="massFinal">Burnout mass</label><span class="val" id="massFinalVal"></span></div>
        <input type="range" id="massFinal" min="1000" max="99000" step="500" value="28000">
        <div class="propellant-note" id="propellantNote"></div>
      </div>
      <div class="field">
        <div class="field-row"><label for="isp">Engine Isp</label><span class="val" id="ispVal"></span></div>
        <input type="range" id="isp" min="150" max="450" step="5" value="300">
      </div>
      <div class="field">
        <div class="field-row"><label for="angle">Launch angle from vertical</label><span class="val" id="angleVal"></span></div>
        <input type="range" id="angle" min="-45" max="45" step="1" value="0">
      </div>

      <div class="section-title">Weather</div>
      <div class="weather-card">
        <div class="day" id="dayLabel">DAY 1</div>
        <div class="wind-line">
          <span class="wind-arrow" id="windArrow">&#8594;</span>
          <div>
            <div class="wind-speed"><span id="windSpeed">0</span> m/s</div>
            <div class="wind-desc" id="windDesc">tailwind, light gusts</div>
          </div>
        </div>
        <div class="weather-actions">
          <button class="btn btn-ghost" id="scrubBtn">Scrub to next day</button>
          <button class="btn btn-primary" id="launchBtn">Launch</button>
        </div>
      </div>

    </div>

    <div class="viewport-wrap" id="viewportWrap">
      <canvas id="canvas"></canvas>
      <div class="status-badge" id="statusBadge">STANDING BY</div>
      <div class="speed-controls" id="speedControls">
        <button data-speed="1">1&times;</button>
        <button data-speed="4" class="active">4&times;</button>
        <button data-speed="10">10&times;</button>
      </div>
      <div class="countdown" id="countdown">3</div>
      <div class="result-overlay" id="resultOverlay">
        <div class="result-card">
          <h2 id="resultTitle">Landed</h2>
          <p id="resultSub">Touchdown within safe limits.</p>
          <div class="result-stats">
            <div><div class="lbl">Max altitude</div><div class="num" id="rAlt">-</div></div>
            <div><div class="lbl">Max speed</div><div class="num" id="rSpeed">-</div></div>
            <div><div class="lbl">Downrange</div><div class="num" id="rRange">-</div></div>
            <div><div class="lbl">Impact speed</div><div class="num" id="rImpact">-</div></div>
          </div>
          <div class="result-actions">
            <button class="btn" id="adjustBtn">Adjust rocket</button>
            <button class="btn btn-primary" id="againBtn">Fly again</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="telemetry">
    <div class="tcell"><div class="lbl">T+</div><div class="num" id="telTime">0.0 s</div></div>
    <div class="tcell"><div class="lbl">Altitude</div><div class="num amber" id="telAlt">0 m</div></div>
    <div class="tcell"><div class="lbl">Speed</div><div class="num amber" id="telSpeed">0 m/s</div></div>
    <div class="tcell"><div class="lbl">Downrange</div><div class="num" id="telRange">0 m</div></div>
    <div class="tcell"><div class="lbl">Mass</div><div class="num" id="telMass">0 kg</div></div>
    <div class="tcell"><div class="lbl">&#916;v used</div><div class="num cyan" id="telDv">0 / 0 m/s</div></div>
    <div class="tcell"><div class="lbl">Phase</div><div class="num" id="telPhase">READY</div></div>
  </div>

</div>

<script>
(function(){
"use strict";

/* ================= physics constants (mirrors the python model) ================= */
const DT = 0.01;
const CD = 0.75;
const PLANETS = {
  earth: { g:9.81, radius:6371000, rho0:1.225, scaleHeight:8500,
           sky:['#3E7BD9','#BFE3FF'], ground:['#2E5B3A','#8B6A3E'], label:'Earth' },
  mars:  { g:3.71, radius:3389500, rho0:0.020, scaleHeight:11100,
           sky:['#C1583A','#E9A46B'], ground:['#8B3A2B','#5C2A1E'], label:'Mars' },
  venus: { g:8.87, radius:6051800, rho0:65.0,  scaleHeight:15900,
           sky:['#D9B24C','#F0D98C'], ground:['#6B5A2E','#4A3E1F'], label:'Venus' },
  moon:  { g:1.62, radius:1737400, rho0:0.0,   scaleHeight:1,
           sky:['#0A0E1A','#1B2233'], ground:['#7A7A7A','#565656'], label:'Moon' },
};
const SPACE_COLOR = '#05070D';

/* Stylized "sky map": as you climb past these altitudes, the other worlds
   become visible in the distance. Not real astronomical distances or sizes
   (those are millions of km) - compressed for a playable sense of climbing
   from one world's sky into open space. */
const BACKDROP = {
  moon:  { alt:40000,  x:-25000 },
  venus: { alt:120000, x:60000  },
  mars:  { alt:220000, x:-90000 },
  earth: { alt:320000, x:140000 },
};
Object.keys(BACKDROP).forEach(k => BACKDROP[k].worldRadius = BACKDROP[k].alt*0.05);

function gravityAt(h,g0,radius){
  h = Math.max(h,0);
  return g0 * Math.pow(radius/(radius+h), 2);
}
function densityAt(h,rho0,scaleHeight){
  if(rho0<=0) return 0;
  h = Math.max(h,0);
  return rho0*Math.exp(-h/scaleHeight);
}
function accel(vx,vy,y,mass,thrustX,thrustY,windX,area,g0,radius,rho0,scaleHeight){
  const gH = gravityAt(y,g0,radius);
  const rho = densityAt(y,rho0,scaleHeight);
  const vrx = vx-windX, vry = vy;
  const speedRel = Math.hypot(vrx,vry);
  let dragX=0, dragY=0;
  if(speedRel>0){
    const dragMag = 0.5*rho*CD*area*speedRel*speedRel;
    dragX = -dragMag*(vrx/speedRel);
    dragY = -dragMag*(vry/speedRel);
  }
  const ax = (thrustX+dragX)/mass;
  const ay = (thrustY+dragY)/mass - gH;
  return [ax,ay];
}
function rk4Step(vx,vy,x,y,mass,thrustX,thrustY,windX,area,g0,radius,rho0,scaleHeight){
  function a(vx_,vy_,y_){ return accel(vx_,vy_,y_,mass,thrustX,thrustY,windX,area,g0,radius,rho0,scaleHeight); }
  const [k1vx,k1vy] = a(vx,vy,y);
  const k1x=vx, k1y=vy;
  const [k2vx,k2vy] = a(vx+0.5*DT*k1vx, vy+0.5*DT*k1vy, y+0.5*DT*k1y);
  const k2x = vx+0.5*DT*k1vx, k2y = vy+0.5*DT*k1vy;
  const [k3vx,k3vy] = a(vx+0.5*DT*k2vx, vy+0.5*DT*k2vy, y+0.5*DT*k2y);
  const k3x = vx+0.5*DT*k2vx, k3y = vy+0.5*DT*k2vy;
  const [k4vx,k4vy] = a(vx+DT*k3vx, vy+DT*k3vy, y+DT*k3y);
  const k4x = vx+DT*k3vx, k4y = vy+DT*k3vy;
  return [
    vx + (DT/6)*(k1vx+2*k2vx+2*k3vx+k4vx),
    vy + (DT/6)*(k1vy+2*k2vy+2*k3vy+k4vy),
    x  + (DT/6)*(k1x +2*k2x +2*k3x +k4x),
    y  + (DT/6)*(k1y +2*k2y +2*k3y +k4y),
  ];
}
function tsiolkovsky(m0,m1,isp){ return isp*9.81*Math.log(m0/m1); }
function gaussianRandom(mean,std){
  let u=0,v=0;
  while(u===0) u=Math.random();
  while(v===0) v=Math.random();
  return mean + std*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);
}
function lerp(a,b,t){ return a+(b-a)*t; }
function lerpColor(hexA,hexB,t){
  const a=parseInt(hexA.slice(1),16), b=parseInt(hexB.slice(1),16);
  const ar=(a>>16)&255, ag=(a>>8)&255, ab=a&255;
  const br=(b>>16)&255, bg=(b>>8)&255, bb=b&255;
  const r=Math.round(lerp(ar,br,t)), g=Math.round(lerp(ag,bg,t)), bl=Math.round(lerp(ab,bb,t));
  return `rgb(${r},${g},${bl})`;
}

/* ================= UI wiring ================= */
const el = id => document.getElementById(id);
const fields = {
  thrust: el('thrust'), burnTime: el('burnTime'), area: el('area'),
  massInitial: el('massInitial'), massFinal: el('massFinal'), isp: el('isp'), angle: el('angle')
};
const fmt = {
  thrust: v => `${Math.round(v/1000).toLocaleString()} kN`,
  burnTime: v => `${v} s`,
  area: v => `${(+v).toFixed(1)} m\u00B2`,
  massInitial: v => `${(+v).toLocaleString()} kg`,
  massFinal: v => `${(+v).toLocaleString()} kg`,
  isp: v => `${v} s`,
  angle: v => `${v > 0 ? '+' : ''}${v}\u00B0`,
};
function refreshFieldLabels(){
  el('thrustVal').textContent = fmt.thrust(fields.thrust.value);
  el('burnTimeVal').textContent = fmt.burnTime(fields.burnTime.value);
  el('areaVal').textContent = fmt.area(fields.area.value);
  el('massInitialVal').textContent = fmt.massInitial(fields.massInitial.value);
  el('massFinalVal').textContent = fmt.massFinal(fields.massFinal.value);
  el('ispVal').textContent = fmt.isp(fields.isp.value);
  el('angleVal').textContent = fmt.angle(fields.angle.value);
  const prop = (+fields.massInitial.value) - (+fields.massFinal.value);
  el('propellantNote').textContent = `${prop.toLocaleString()} kg propellant`;
}
fields.massInitial.addEventListener('input', ()=>{
  const maxFinal = (+fields.massInitial.value) - 500;
  fields.massFinal.max = Math.max(maxFinal, 500);
  if(+fields.massFinal.value > maxFinal) fields.massFinal.value = maxFinal;
  refreshFieldLabels();
});
Object.values(fields).forEach(f => f.addEventListener('input', refreshFieldLabels));
refreshFieldLabels();

let currentPlanet = 'earth';
document.getElementById('planetTabs').addEventListener('click', e=>{
  const btn = e.target.closest('button[data-planet]');
  if(!btn) return;
  document.querySelectorAll('#planetTabs button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  currentPlanet = btn.dataset.planet;
  day = 1;
  rollWeather();
});

let simSpeed = 4;
document.getElementById('speedControls').addEventListener('click', e=>{
  const btn = e.target.closest('button[data-speed]');
  if(!btn) return;
  document.querySelectorAll('#speedControls button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  simSpeed = +btn.dataset.speed;
});

/* ================= weather / day mechanic ================= */
let day = 1;
let weather = null; // {speedMag, direction, gustStd}

function rollWeather(){
  const planet = PLANETS[currentPlanet];
  const noAtmo = planet.rho0 <= 0;
  const speedMag = noAtmo ? 0 : Math.random()*20;
  const direction = Math.random() < 0.5 ? -1 : 1;
  const gustStd = speedMag*0.15;
  weather = { speedMag, direction, gustStd, noAtmo };
  el('dayLabel').textContent = `DAY ${day} \u00B7 ${planet.label.toUpperCase()}`;
  el('windSpeed').textContent = speedMag.toFixed(1);
  el('windArrow').textContent = direction>0 ? '\u2192' : '\u2190';
  el('windArrow').style.transform = direction>0 ? 'scaleX(1)' : 'scaleX(-1)';
  if(noAtmo){
    el('windDesc').textContent = 'no atmosphere \u2014 wind has no effect';
    el('windSpeed').parentElement.style.opacity = 0.4;
  } else {
    el('windSpeed').parentElement.style.opacity = 1;
    const desc = speedMag < 6 ? 'light breeze' : speedMag < 13 ? 'moderate wind' : 'strong wind, expect drift';
    el('windDesc').textContent = `${direction>0?'tailwind':'headwind'}, ${desc}`;
  }
}
rollWeather();

el('scrubBtn').addEventListener('click', ()=>{
  day += 1;
  rollWeather();
});

/* ================= flight state ================= */
const canvas = el('canvas');
const ctx = canvas.getContext('2d');
const wrap = el('viewportWrap');
function resizeCanvas(){
  const r = wrap.getBoundingClientRect();
  canvas.width = r.width * devicePixelRatio;
  canvas.height = r.height * devicePixelRatio;
  canvas.style.width = r.width+'px';
  canvas.style.height = r.height+'px';
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

const stars = Array.from({length:140}, ()=>({
  x: Math.random(), y: Math.random(), r: Math.random()*1.4+0.3
}));

let flight = null; // active flight state
let camScale = null, camX = null, camY = null;
let lastFrameTs = null;
let rafId = null;

function buildFlightConfig(){
  const planet = PLANETS[currentPlanet];
  return {
    planet,
    thrust: +fields.thrust.value,
    burnTime: +fields.burnTime.value,
    area: +fields.area.value,
    m0: +fields.massInitial.value,
    m1: +fields.massFinal.value,
    isp: +fields.isp.value,
    angleRad: (+fields.angle.value) * Math.PI/180,
    baseWindX: weather.speedMag*weather.direction,
    gustStd: weather.gustStd,
  };
}

function startCountdown(){
  el('launchBtn').disabled = true;
  el('scrubBtn').disabled = true;
  const cd = el('countdown');
  cd.classList.add('show');
  let n = 3;
  cd.textContent = n;
  const iv = setInterval(()=>{
    n -= 1;
    if(n>0){ cd.textContent = n; }
    else if(n===0){ cd.textContent = 'GO'; }
    else{
      clearInterval(iv);
      cd.classList.remove('show');
      beginFlight();
    }
  },650);
}

function beginFlight(){
  const cfg = buildFlightConfig();
  const mass0 = cfg.m0;
  flight = {
    cfg,
    t:0, x:0, y:0, vx:0, vy:0,
    mass: mass0,
    massFlowRate: cfg.burnTime>0 ? (cfg.m0-cfg.m1)/cfg.burnTime : 0,
    totalDv: tsiolkovsky(cfg.m0, cfg.m1, cfg.isp),
    dvUsed: 0,
    trail: [{x:0,y:0}],
    maxAlt: 0, maxSpeed: 0,
    phase: 'ASCENT',
    done: false,
  };
  camScale = null;
  camX = null;
  camY = null;
  el('statusBadge').textContent = 'IN FLIGHT';
  el('statusBadge').className = 'status-badge live';
  el('statusDot').style.background = 'var(--green)';
  el('resultOverlay').classList.remove('show');
  lastFrameTs = null;
  if(rafId) cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(loop);
}

el('launchBtn').addEventListener('click', startCountdown);

function stepPhysics(){
  const f = flight, c = f.cfg;
  const burning = f.t <= c.burnTime;
  let thrustX=0, thrustY=0;
  if(burning){
    thrustX = c.thrust*Math.sin(c.angleRad);
    thrustY = c.thrust*Math.cos(c.angleRad);
  }
  const windX = c.baseWindX + gaussianRandom(0, c.gustStd);
  const [nvx,nvy,nx,ny] = rk4Step(
    f.vx,f.vy,f.x,f.y, f.mass, thrustX, thrustY, windX,
    c.area, c.planet.g, c.planet.radius, c.planet.rho0, c.planet.scaleHeight
  );
  if(burning){
    f.mass = Math.max(f.mass - f.massFlowRate*DT, c.m1);
    f.dvUsed = tsiolkovsky(c.m0, f.mass, c.isp);
  } else {
    f.dvUsed = f.totalDv;
  }
  f.vx=nvx; f.vy=nvy; f.x=nx; f.y=ny; f.t += DT;
  f.maxAlt = Math.max(f.maxAlt, f.y);
  const spd = Math.hypot(f.vx,f.vy);
  f.maxSpeed = Math.max(f.maxSpeed, spd);
  f.phase = burning ? 'ASCENT' : (f.vy>=0 ? 'COAST' : 'DESCENT');
  if(Math.round(f.t/DT) % 4 === 0){
    f.trail.push({x:f.x,y:f.y});
    if(f.trail.length>3000) f.trail.shift();
  }
  if(f.y < 0){
    f.done = true;
    f.impactSpeed = spd;
    f.landed = Math.abs(f.vy) <= 6;
    f.y = 0;
  }
}

function loop(ts){
  if(lastFrameTs===null) lastFrameTs = ts;
  let frameDt = (ts-lastFrameTs)/1000;
  lastFrameTs = ts;
  frameDt = Math.min(frameDt, 0.05);

  if(flight && !flight.done){
    let simTime = frameDt*simSpeed;
    let steps = Math.min(Math.floor(simTime/DT), 4000);
    for(let i=0;i<steps && !flight.done;i++) stepPhysics();
  }

  render();
  updateTelemetry();

  if(flight && flight.done && !flight.finalized){
    flight.finalized = true;
    onLanded();
  }

  rafId = requestAnimationFrame(loop);
}

function onLanded(){
  el('statusBadge').textContent = flight.landed ? 'TOUCHDOWN' : 'IMPACT';
  el('statusBadge').className = 'status-badge ' + (flight.landed ? 'land':'crash');
  el('statusDot').style.background = flight.landed ? 'var(--cyan)' : 'var(--red)';
  el('resultTitle').textContent = flight.landed ? 'Landed' : 'Crashed';
  el('resultTitle').className = flight.landed ? 'land' : 'crash';
  el('resultSub').textContent = flight.landed
    ? 'Touchdown speed within safe limits.'
    : 'Impact speed exceeded safe limits.';
  el('rAlt').textContent = `${flight.maxAlt.toFixed(0)} m`;
  el('rSpeed').textContent = `${flight.maxSpeed.toFixed(1)} m/s`;
  el('rRange').textContent = `${flight.x.toFixed(0)} m`;
  el('rImpact').textContent = `${flight.impactSpeed.toFixed(1)} m/s`;
  el('resultOverlay').classList.add('show');
  el('launchBtn').disabled = false;
  el('scrubBtn').disabled = false;
}

el('adjustBtn').addEventListener('click', ()=>{
  el('resultOverlay').classList.remove('show');
  flight = null;
  el('statusBadge').textContent = 'STANDING BY';
  el('statusBadge').className = 'status-badge';
  el('statusDot').style.background = 'var(--green)';
});
el('againBtn').addEventListener('click', ()=>{
  el('resultOverlay').classList.remove('show');
  day += 1;
  rollWeather();
  flight = null;
  el('statusBadge').textContent = 'STANDING BY';
  el('statusBadge').className = 'status-badge';
  el('statusDot').style.background = 'var(--green)';
});

/* ================= rendering ================= */
function drawBackdropPlanets(worldToScreen, camScale, w, h){
  Object.keys(BACKDROP).forEach(name=>{
    if(name===currentPlanet) return;
    const cfg = BACKDROP[name];
    const body = PLANETS[name];
    const [sx,sy] = worldToScreen(cfg.x, cfg.alt);
    const r = Math.min(Math.max(cfg.worldRadius*camScale, 4*devicePixelRatio), 160*devicePixelRatio);
    if(sx < -r-60 || sx > w+r+60 || sy < -r-60 || sy > h+r+60) return;

    const grad = ctx.createRadialGradient(sx-r*0.35, sy-r*0.35, r*0.08, sx, sy, r);
    grad.addColorStop(0, body.sky[1]);
    grad.addColorStop(0.55, body.sky[0]);
    grad.addColorStop(1, body.ground[1]);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(sx, sy, r, 0, Math.PI*2);
    ctx.fill();

    if(r > 9*devicePixelRatio){
      ctx.fillStyle = 'rgba(233,238,247,0.8)';
      ctx.font = `${Math.round(10*devicePixelRatio)}px 'IBM Plex Mono', monospace`;
      ctx.textAlign = 'center';
      ctx.fillText(body.label.toUpperCase(), sx, sy + r + 15*devicePixelRatio);
    }
  });
}

function render(){
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0,0,w,h);
  const planet = PLANETS[currentPlanet];

  const altForZoom = flight ? Math.max(flight.maxAlt, 60) : 60;
  const spaceT = flight ? Math.min(altForZoom/(planet.scaleHeight*6+1), 1) : 0;

  const skyTop = lerpColor(planet.sky[0], SPACE_COLOR, spaceT);
  const skyBottom = lerpColor(planet.sky[1], planet.sky[0], spaceT*0.6);
  const grad = ctx.createLinearGradient(0,0,0,h);
  grad.addColorStop(0, skyTop);
  grad.addColorStop(1, skyBottom);
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,w,h);

  const starAlpha = planet.rho0<=0 ? 0.9 : spaceT;
  if(starAlpha>0.02){
    ctx.fillStyle = `rgba(255,255,255,${starAlpha})`;
    stars.forEach(s=>{
      ctx.beginPath();
      ctx.arc(s.x*w, s.y*h*0.7, s.r*devicePixelRatio, 0, Math.PI*2);
      ctx.fill();
    });
  }

  const groundMargin = 46*devicePixelRatio;
  const targetScale = (h*0.42) / Math.max(altForZoom, 60);
  camScale = camScale===null ? targetScale : lerp(camScale, targetScale, 0.06);

  // While in flight, the rocket is pinned at screen-center and the world
  // scrolls around it. On the pad (no flight yet), keep the launch-pad
  // framing with the ground near the bottom.
  const screenFocusX = w/2;
  const screenFocusY = flight ? h/2 : (h - groundMargin);
  const focusWorldX = flight ? flight.x : 0;
  const focusWorldY = flight ? flight.y : 0;
  camX = camX===null ? focusWorldX : lerp(camX, focusWorldX, 0.08);
  camY = camY===null ? focusWorldY : lerp(camY, focusWorldY, 0.08);

  const worldToScreen = (x,y) => [
    screenFocusX + (x-camX)*camScale,
    screenFocusY - (y-camY)*camScale
  ];

  const groundY = worldToScreen(0,0)[1];
  if(!flight && groundY < h){
    const gGrad = ctx.createLinearGradient(0,groundY,0,h);
    gGrad.addColorStop(0, planet.ground[0]);
    gGrad.addColorStop(1, planet.ground[1]);
    ctx.fillStyle = gGrad;
    ctx.fillRect(0, groundY, w, Math.max(h-groundY,0));
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0,groundY); ctx.lineTo(w,groundY); ctx.stroke();
  }

  drawBackdropPlanets(worldToScreen, camScale, w, h);

  if(flight && flight.trail.length>1){
    ctx.strokeStyle = 'rgba(87,224,232,0.55)';
    ctx.lineWidth = 2*devicePixelRatio;
    ctx.beginPath();
    flight.trail.forEach((p,i)=>{
      const [sx,sy] = worldToScreen(p.x,p.y);
      if(i===0) ctx.moveTo(sx,sy); else ctx.lineTo(sx,sy);
    });
    ctx.stroke();
  }

  if(flight){
    const [rx,ry] = worldToScreen(flight.x, flight.y);
    const pitch = Math.atan2(flight.vx, Math.max(flight.vy,0.001));
    const burning = flight.t <= flight.cfg.burnTime && !flight.done;

    ctx.save();
    ctx.translate(rx,ry);
    ctx.rotate(pitch);

    if(burning){
      const flicker = 10 + Math.random()*10;
      const flameGrad = ctx.createLinearGradient(0,10*devicePixelRatio,0,(10+flicker)*devicePixelRatio);
      flameGrad.addColorStop(0,'rgba(255,179,0,0.95)');
      flameGrad.addColorStop(1,'rgba(255,92,92,0)');
      ctx.fillStyle = flameGrad;
      ctx.beginPath();
      ctx.moveTo(-4*devicePixelRatio, 9*devicePixelRatio);
      ctx.lineTo(4*devicePixelRatio, 9*devicePixelRatio);
      ctx.lineTo(0, (10+flicker)*devicePixelRatio);
      ctx.closePath();
      ctx.fill();
    }

    const s = devicePixelRatio;
    ctx.fillStyle = '#D8DEE9';
    ctx.beginPath();
    ctx.moveTo(0,-14*s);
    ctx.lineTo(4.5*s,-4*s);
    ctx.lineTo(4.5*s,8*s);
    ctx.lineTo(-4.5*s,8*s);
    ctx.lineTo(-4.5*s,-4*s);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#57E0E8';
    ctx.beginPath();
    ctx.arc(0,-2*s,2.2*s,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#FFB300';
    ctx.beginPath();
    ctx.moveTo(-4.5*s,4*s); ctx.lineTo(-9*s,9*s); ctx.lineTo(-4.5*s,9*s); ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(4.5*s,4*s); ctx.lineTo(9*s,9*s); ctx.lineTo(4.5*s,9*s); ctx.closePath(); ctx.fill();

    ctx.restore();
  } else {
    const [rx,ry] = worldToScreen(0,0);
    ctx.save();
    ctx.translate(rx,ry-8*devicePixelRatio);
    const s = devicePixelRatio;
    ctx.fillStyle = '#D8DEE9';
    ctx.beginPath();
    ctx.moveTo(0,-14*s); ctx.lineTo(4.5*s,-4*s); ctx.lineTo(4.5*s,8*s);
    ctx.lineTo(-4.5*s,8*s); ctx.lineTo(-4.5*s,-4*s); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
}

function updateTelemetry(){
  if(!flight){
    el('telTime').textContent = '0.0 s';
    el('telAlt').textContent = '0 m';
    el('telSpeed').textContent = '0 m/s';
    el('telRange').textContent = '0 m';
    el('telMass').textContent = `${(+fields.massInitial.value).toLocaleString()} kg`;
    const total = tsiolkovsky(+fields.massInitial.value, +fields.massFinal.value, +fields.isp.value);
    el('telDv').textContent = `0 / ${total.toFixed(0)} m/s`;
    el('telPhase').textContent = 'READY';
    return;
  }
  el('telTime').textContent = `${flight.t.toFixed(1)} s`;
  el('telAlt').textContent = `${flight.y.toFixed(0)} m`;
  el('telSpeed').textContent = `${Math.hypot(flight.vx,flight.vy).toFixed(1)} m/s`;
  el('telRange').textContent = `${flight.x.toFixed(0)} m`;
  el('telMass').textContent = `${flight.mass.toFixed(0)} kg`;
  el('telDv').textContent = `${flight.dvUsed.toFixed(0)} / ${flight.totalDv.toFixed(0)} m/s`;
  el('telPhase').textContent = flight.done ? (flight.landed?'LANDED':'CRASHED') : flight.phase;
}

/* initial idle render loop so the pad isn't blank before first launch */
requestAnimationFrame(function idle(ts){
  render();
  updateTelemetry();
  if(!flight) requestAnimationFrame(idle);
});

})();
</script>
</body>
</html>
